name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

# 👑 追記：Nodeの最新アップデートによるクラッシュを回避するおまじない
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build dist/
        run: python build.py

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 👑 追記：Wranglerに「デプロイして」と明示し、エラーがあれば詳細を出させる
          command: deploy --log-level debug
