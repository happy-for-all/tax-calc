name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # 👑 四国回線と同じく、手動実行ボタンも出せるように追加
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ※tax-calcのbuild.pyは標準ライブラリのみ使用のため、pip installは省略（最速化）

      - name: build.py を実行
        run: python build.py

      # 👇 ここからが四国回線の成功実績ロジックの完全移植です 👇
      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wrangler をインストール
        run: npm install -g wrangler

      - name: Cloudflare Workers へデプロイ
        env:
          # 新しいリポジトリ(tax-calc)のSecretsにこれが登録されていることだけ確認してください！
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy
